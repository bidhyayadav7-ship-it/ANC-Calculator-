name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Android app
        run: |
          cordova create app com.anc.calculator "ANC Calculator"
          cp index.html app/www/index.html

      - name: Add Android platform
        run: |
          cd app
          cordova platform add android

      - name: Build APK
        run: |
          cd app
          cordova build android --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANC-Calculator-APK
          path: app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
